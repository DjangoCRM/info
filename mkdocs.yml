site_name: Django-CRM
site_url: https://DjangoCRM.github.io/info/
site_description: >-
  Analytical CRM with Tasks management, Email marketing and many more. 
  CRM and task management software is built for individual use by businesses of any size, but is especially useful for small businesses. It is designed to provide easy customization and quick development.
  Deploy on your server or cloud platform

# dev_addr: '127.0.0.1:8000'  # Allows a custom default to be set in format IP:PORT

repo_url: https://github.com/DjangoCRM/django-crm
repo_name: Django CRM GitHub
site_author: Vadym Kharchenko
copyright: Copyright &copy; 2024 - 2026 Vadym Kharchenko

theme:
  name: material
  custom_dir: material/overrides
  logo: assets/img/django-crm_logo.png
  favicon: assets/img/favicon.ico
  palette:
    scheme: django-crm
  language: en
  features:
    # - navigation.instant # mkdocs_static_i18n: mkdocs-material language switcher contextual link
    #           is not compatible with theme.features = navigation.instant
    - navigation.indexes  # useful for providing overview pages
    - navigation.tracking   # the URL in the address bar is automatically updated with the active anchor as highlighted in the table of contents.
    - navigation.tabs
    - navigation.expand
    # - navigation.tabs.sticky
    # - navigation.sections
    # - navigation.path # for insiders
    - navigation.top
    # footer settings
    - navigation.footer

extra_css:
  # Color variables
  # https://github.com/squidfunk/mkdocs-material/blob/master/src/templates/assets/stylesheets/main/_colors.scss
  - assets/css/extra.css

plugins:
  # - optimize # automatically identifies and optimizes all media files
  - glightbox
  # - social
  - i18n:   # plugin `mkdocs-static-i18n` 
      docs_structure: folder
      languages:
      # English
        - locale: en
          default: true
          name: English
          link: /
          build: true
      # Española
        - locale: es
          name: Española
          build: true       # false
          link: /es/
          nav:
            - Página principal: index.md
            - Características:
              - Descripción general del software CRM: features/overview.md
              - CRM y gestión de tareas: features/tasks-app-features.md
              - Características de la aplicación CRM: features/crm-app-features.md
              - Software de análisis de CRM: features/analytics-app-features.md
              - Email marketing integrado en el CRM: features/massmail-app-features.md
              - CRM y gestión de proyectos: features/crm-and-project-management.md
            - Documentación: documentation.md
            - Descargar: download.md
            - Soporte: support.md
            - Ayuda:
              - help/index.md
              - Módulo de tareas:
                - Tareas:
                  - Administrador de tareas: help/task-management.md
                  - Crear y asignar tareas: help/creating-assigning-tasks.md
                  - Tareas de edición y actualización: help/editing-updating-tasks.md
                  - Eliminar tareas: help/deleting-tasks.md
                - Memos (notas de CRM):
                  - Cómo trabajar con las notas del CRM: help/notes-crm.md
                  - Creación de notas: help/creating-crm-note.md
                  - Edición y actualización de notas:  help/editing-updating-crm-note.md
                  - Eliminar memos: help/deleting-crm-note.md
                - Proyectos:
                  - Gestión de proyectos: help/project-management.md
                  - Creación y asignación de proyectos: help/creating-assigning-projects.md
              - Módulo de CRM`:
                  - Gestión de solicitudes comerciales: help/commercial-requests-management.md
                  - Procesamiento de solicitudes: help/request-processing.md
                  - Gestión de acuerdos: help/deals-management.md
                  - Correo electrónico en el CRM: help/email-in-crm.md
                  - Trabajar con acuerdos: help/working-with-deals.md
                  - Gestión de clientes potenciales: help/lead-management.md
                  - Dirección de la empresa: help/company-management.md
                  - Gestión de contactos: help/contact-management.md
              - Módulo de envío masivo de correos electrónicos:
                  - Gestión de envíos masivos: help/managing-mass-mailings.md
                  - Gestión de boletines: help/managing-newsletters.md
                  - Gestión de cuentas de correo electrónico: help/email-accounts-management.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Features:
    - CRM Software Overview: features/overview.md
    - CRM and Task management: features/tasks-app-features.md
    - CRM application features: features/crm-app-features.md
    - CRM analytics software: features/analytics-app-features.md
    - CRM email marketing: features/massmail-app-features.md
    - CRM and Project management: features/crm-and-project-management.md
  - Documentation: documentation.md
  - Download: download.md
  - Support: support.md
  - Help:
    - help/index.md
    - Tasks Module:
      - Tasks:
        - Task manager: help/task-management.md
        - Creating and assigning tasks: help/creating-assigning-tasks.md
        - Editing and updating tasks: help/editing-updating-tasks.md
        - Deleting tasks: help/deleting-tasks.md
      - Memos (CRM notes):
        - Working with CRM notes: help/notes-crm.md
        - Memo creation: help/creating-crm-note.md
        - Editing and updating memos:  help/editing-updating-crm-note.md
        - Deleting memos: help/deleting-crm-note.md
      - Projects:
        - Project management: help/project-management.md
        - Creating and assigning projects: help/creating-assigning-projects.md
    - CRM Module:
        - Commercial request management: help/commercial-requests-management.md
        - Request processing: help/request-processing.md
        - Deal management: help/deals-management.md
        - Email in CRM: help/email-in-crm.md
        - Working with deals: help/working-with-deals.md
        - Lead management: help/lead-management.md
        - Company management: help/company-management.md
        - Contact management: help/contact-management.md
    - Mass mailing Module:
        - Managing mass mailings: help/managing-mass-mailings.md
        - Newsletter management: help/managing-newsletters.md
        - Email accounts management: help/email-accounts-management.md
#        - Email marketing overview: help/email-marketing-overview.md
#        - Creating and sending mass emails: help/creating-sending-mass-emails.md

extra:
  analytics:
    provider: google
    property: G-NL555B7QKF
